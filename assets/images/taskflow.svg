<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140610"/>
      <stop offset="50%" stop-color="#240c1c"/>
      <stop offset="100%" stop-color="#380e28"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(48, 16, 38, 0.85)"/>
      <stop offset="100%" stop-color="rgba(24, 8, 19, 0.95)"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#60efff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Cyber Grid -->
  <g opacity="0.08" stroke="#00ff87" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="950" cy="180" r="220" fill="#00ff87" opacity="0.12" filter="url(#glow)"/>
  <circle cx="250" cy="500" r="260" fill="#e11d48" opacity="0.15" filter="url(#glow)"/>

  <!-- App Window Container -->
  <rect x="120" y="70" width="960" height="535" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <!-- App Header -->
  <line x1="120" y1="135" x2="1080" y2="135" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="160" cy="102" r="7" fill="#ff5f56"/>
  <circle cx="185" cy="102" r="7" fill="#ffbd2e"/>
  <circle cx="210" cy="102" r="7" fill="#27c93f"/>
  
  <text x="250" y="108" fill="#fff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" letter-spacing="1.5">TASKFLOW // AUTH &amp; WORKFLOW</text>
  <rect x="910" y="87" width="140" height="30" rx="15" fill="rgba(0, 255, 135, 0.15)" stroke="#00ff87" stroke-width="1"/>
  <text x="940" y="107" fill="#00ff87" font-family="'DM Mono', monospace" font-size="12" font-weight="600">● JWT SECURE</text>

  <!-- Sidebar Column -->
  <rect x="150" y="165" width="220" height="410" rx="14" fill="rgba(15, 5, 12, 0.6)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="175" y="205" fill="#f472b6" font-family="'DM Mono', monospace" font-size="12" letter-spacing="2">SESSION STATUS</text>
  
  <rect x="175" y="225" width="170" height="42" rx="8" fill="rgba(0,255,135,0.08)" stroke="rgba(0,255,135,0.3)" stroke-width="1"/>
  <text x="190" y="251" fill="#fff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Verified User</text>
  
  <text x="175" y="305" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="13">Token Expiry: 24h</text>
  <text x="175" y="330" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="13">Nodemailer: Connected</text>
  <text x="175" y="355" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="13">Encryption: AES-256</text>

  <!-- Main Tasks Board -->
  <g transform="translate(400, 165)">
    <!-- Column 1 -->
    <rect x="0" y="0" width="310" height="410" rx="14" fill="rgba(15, 5, 12, 0.6)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="20" y="38" fill="#fbcfe8" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">IN PROGRESS (3)</text>
    
    <!-- Task card 1 -->
    <rect x="15" y="55" width="280" height="95" rx="10" fill="rgba(42, 14, 34, 0.75)" stroke="rgba(0, 255, 135, 0.3)" stroke-width="1"/>
    <text x="32" y="85" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">JWT Refresh Pipeline</text>
    <text x="32" y="105" fill="#a78295" font-family="'DM Mono', monospace" font-size="11">auth.service.ts // Express</text>
    <rect x="32" y="118" width="60" height="18" rx="9" fill="rgba(0,255,135,0.2)"/>
    <text x="44" y="131" fill="#00ff87" font-family="'DM Mono', monospace" font-size="10">HIGH</text>

    <!-- Task card 2 -->
    <rect x="15" y="165" width="280" height="95" rx="10" fill="rgba(42, 14, 34, 0.75)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="32" y="195" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Verification Email Webhook</text>
    <text x="32" y="215" fill="#a78295" font-family="'DM Mono', monospace" font-size="11">nodemailer.transport.js</text>
    
    <!-- Column 2 Completed -->
    <rect x="335" y="0" width="310" height="410" rx="14" fill="rgba(15, 5, 12, 0.6)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="355" y="38" fill="#00ff87" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">VERIFIED &amp; COMPLETED (12)</text>
    
    <!-- Completed card 1 -->
    <rect x="350" y="55" width="280" height="95" rx="10" fill="rgba(42, 14, 34, 0.75)" stroke="rgba(0,255,135,0.4)" stroke-width="1"/>
    <text x="367" y="85" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Double Opt-In Flow</text>
    <text x="367" y="105" fill="#00ff87" font-family="'DM Mono', monospace" font-size="11">✓ Security audit passed</text>
    
    <!-- Completed card 2 -->
    <rect x="350" y="165" width="280" height="95" rx="10" fill="rgba(42, 14, 34, 0.75)" stroke="rgba(0,255,135,0.4)" stroke-width="1"/>
    <text x="367" y="195" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Bcrypt Salt Hashing</text>
    <text x="367" y="215" fill="#00ff87" font-family="'DM Mono', monospace" font-size="11">✓ Zero plain text passwords</text>
  </g>
</svg>
