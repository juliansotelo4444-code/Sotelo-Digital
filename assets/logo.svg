<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <!-- Isotype icon -->
  <g transform="translate(5, 5)">
    <!-- Outer isometric hexagon -->
    <polygon points="40,5 75,25 75,65 40,85 5,65 5,25" 
             stroke="#111111" stroke-width="4" stroke-linejoin="round" fill="none" opacity="0.2"/>
    
    <!-- Isometric Cube Facets & S Ribbon -->
    <path d="M40 5 L75 25 L40 45 L5 25 Z" 
          stroke="#111111" stroke-width="4.5" stroke-linejoin="round" fill="none"/>
    <path d="M5 25 L40 5 L75 25 L40 45" 
          stroke="#E50914" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 45 L5 65 L40 85 L75 65" 
          stroke="#E50914" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5 25 L5 65 L40 85 L40 45" 
          stroke="#111111" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M75 25 L75 65 L40 85" 
          stroke="#E50914" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="40" cy="45" r="3.5" fill="#E50914"/>
  </g>

  <!-- Typography -->
  <text x="96" y="34" font-family="'Montserrat', 'Outfit', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="2.5" fill="#0A0A0A">SOTELO</text>
  <text x="96" y="60" font-family="'Montserrat', 'Outfit', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="2.5" fill="#E50914">DIGITAL</text>
  <text x="97" y="77" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="4" fill="#666666">CREATIVE AGENCY</text>
  
  <!-- Red accent separator dash -->
  <rect x="235" y="72" width="16" height="2.5" rx="1.25" fill="#E50914"/>
</svg>
