<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Top Face -->
  <polygon points="50,15 85,35 50,55 15,35" stroke="#FF1E27" stroke-width="2.5" fill="#1A1A1A" fill-opacity="0.8" stroke-linejoin="round"/>
  <!-- Left Face -->
  <polygon points="15,35 50,55 50,90 15,70" stroke="#333333" stroke-width="2.5" fill="#0D0D0D" fill-opacity="0.9" stroke-linejoin="round"/>
  <!-- Right Face -->
  <polygon points="50,55 85,35 85,70 50,90" stroke="#FF1E27" stroke-width="2.5" fill="#141414" fill-opacity="0.85" stroke-linejoin="round"/>
  <!-- Center Axis -->
  <polyline points="50,55 50,90" stroke="#FF1E27" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="55" r="2.5" fill="#FF1E27"/>
</svg>
